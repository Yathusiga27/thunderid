resource_type: user_type
id: travel-customer-type
category: user
name: TravelCustomer
ouHandle: default
allowSelfRegistration: false
systemAttributes:
  display: username
schema: {
    "username": {"type": "string", "displayName": "Username", "required": true, "unique": true},
    "password": {"type": "string", "displayName": "Password", "required": false, "credential": true},
    "email": {"type": "string", "displayName": "Email", "required": true, "unique": true},
    "ouId": {"type": "string", "displayName": "Organization Unit", "required": true},
    "accountStatus": {"type": "string", "displayName": "Account Status", "required": true}
  }

---
resource_type: user_type
id: travel-staff-type
category: user
name: TravelStaff
ouHandle: default
allowSelfRegistration: false
systemAttributes:
  display: username
schema: {
    "username": {"type": "string", "displayName": "Username", "required": true, "unique": true},
    "password": {"type": "string", "displayName": "Password", "required": false, "credential": true},
